<header class="header">
    <div class="header-content">

      <!-- Logo/Home Button -->
      <a routerLink="/home" class="logo" aria-label="Home">
        <span class="logo-text">Bruno Felix</span>
      </a>

      <!-- Navigation Links -->
      <nav class="nav-links">
        <a routerLink="/home"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{exact: true}"
          class="nav-link">
          Home
        </a>
        <a routerLink="/cv"
          routerLinkActive="active"
          class="nav-link">
          CV
        </a>
      </nav>

      <!-- Localization Selector (desktop) -->
      <div class="locale-selector">
        @for (lang of languages; track lang) {
          <button
            [ngClass]="{'active': isLangActive(lang.code)}"
            (click)="switchLanguage(lang.code)"
            class="locale-btn"
            [attr.aria-label]="lang.label + ' language'">
            {{ lang.label }}
          </button>
        }
      </div>

      <!-- Mobile Menu Button -->
      <button class="mobile-menu-btn" (click)="toggleMobileMenu()" aria-label="Toggle menu">
        @if (!isMobileMenuOpen) {
          <i class="fas fa-bars"></i>
        }
        @if (isMobileMenuOpen) {
          <i class="fas fa-times"></i>
        }
      </button>
    </div>

    <!-- Mobile Menu -->
    <div class="mobile-menu" [class.open]="isMobileMenuOpen">
      <a routerLink="/home"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: true}"
        class="mobile-nav-link"
        (click)="closeMobileMenu()">
        Home
      </a>
      <a routerLink="/certificates"
        routerLinkActive="active"
        class="mobile-nav-link"
        (click)="closeMobileMenu()">
        Certificates
      </a>
      <a routerLink="/cv"
        routerLinkActive="active"
        class="mobile-nav-link"
        (click)="closeMobileMenu()">
        CV
      </a>

      <!-- Localization Selector (mobile) -->
      <div class="locale-selector mobile-locale">
        @for (lang of languages; track lang) {
          <button
            [ngClass]="{'active': isLangActive(lang.code)}"
            (click)="switchLanguage(lang.code); closeMobileMenu()"
            class="locale-btn"
            [attr.aria-label]="lang.label + ' language'">
            {{ lang.label }}
          </button>
        }
      </div>
    </div>
  </header>
